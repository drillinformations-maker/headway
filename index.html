    <script>
      // Dynamic fallback override to prevent "TypeError: Cannot set property fetch of #<Window>"
      // which can occur when iframe monitoring environments or extensions attempt to wrap fetch.
      (function() {
        try {
          const original = window.fetch;
          let activeFetch = original;
          Object.defineProperty(window, 'fetch', {
            get() {
              return activeFetch;
            },
            set(value) {
              activeFetch = value;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          console.warn('[Window patch] Could not redefine window.fetch:', err);
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
